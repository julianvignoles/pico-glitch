<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>NEO//DIVE</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#05030f; overflow:hidden; }
  body { font-family:"Courier New", monospace; display:flex; align-items:center; justify-content:center; cursor:crosshair; touch-action:none; }
  #game { display:block; image-rendering:pixelated; image-rendering:crisp-edges; background:#05030f; }
  #crt { position:fixed; inset:0; pointer-events:none; z-index:10;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 50%, rgba(5,0,15,0.75) 100%);
    mix-blend-mode:multiply; }
  #flicker { position:fixed; inset:0; pointer-events:none; z-index:11; background:#ff2e88; opacity:0; mix-blend-mode:screen; }
  #hint { position:fixed; bottom:7px; left:0; right:0; text-align:center; color:#19e6ff; font-size:11px; z-index:12; opacity:.5; letter-spacing:3px; text-shadow:0 0 5px #19e6ff; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="crt"></div>
  <div id="flicker"></div>
  <div id="hint">[MOVE] &lt; &gt; / A D&nbsp;&nbsp;&nbsp;[FIRE] SPACE / CLICK&nbsp;&nbsp;&nbsp;[PAUSE] P&nbsp;&nbsp;&nbsp;[MUTE] M</div>
<script>
(() => {
  const view = document.getElementById("game");
  const vctx = view.getContext("2d");
  const flick = document.getElementById("flicker");
  const buf = document.createElement("canvas");
  const b = buf.getContext("2d");

  const CY = "#19e6ff", MG = "#ff2e88", PU = "#a24bff", YE = "#ffe14d", WH = "#eafcff";
  const ZONES = [CY, MG, PU];

  let W, H, DPR, PIX, bw, bh;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    view.width = W * DPR; view.height = H * DPR;
    view.style.width = W + "px"; view.style.height = H + "px";
    PIX = Math.max(3, Math.round(W / 460));
    bw = Math.ceil(W / PIX); bh = Math.ceil(H / PIX);
    buf.width = bw; buf.height = bh;
    makeWorld();
  }
  addEventListener("resize", resize);

  // ---------- input ----------
  function goFullscreen() {
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(() => {});
  }
  const keys = {};
  let shootHeld = false, firePulse = false, pointerX = null;
  addEventListener("keydown", e => {
    goFullscreen(); startAudio();
    const k = e.key.toLowerCase(); keys[k] = true;
    if ([" ", "arrowleft", "arrowright", "arrowup", "arrowdown"].includes(k)) e.preventDefault();
    if (k === " ") shootHeld = true;
    if (k === "m") { toggleMute(); return; }
    if (state === "boot" || state === "dead") startGame();
    else if (k === "p" && state === "play") paused = !paused;
  });
  addEventListener("keyup", e => { const k = e.key.toLowerCase(); keys[k] = false; if (k === " ") shootHeld = false; });
  addEventListener("pointerdown", e => { goFullscreen(); startAudio(); pointerX = e.clientX; shootHeld = true; firePulse = true; if (state === "boot" || state === "dead") startGame(); });
  addEventListener("pointermove", e => { if (pointerX !== null) pointerX = e.clientX; });
  addEventListener("pointerup", () => { shootHeld = false; });

  // ---------- state ----------
  let state = "boot", paused = false, t = 0;
  let shakeMag = 0, shX = 0, shY = 0, hitFlash = 0;
  let actx = null, master = null, droneGain = null, droneFilter = null, muted = false, audioStarted = false;
  let player, bullets, enemies, particles, bubbles, wallSeed, stars;
  let depth, best = +(localStorage.getItem("neodive_best") || 0), lives, spawnTimer, diff, fireCd, combo, comboTimer;

  const bootLines = [
    { at: 0,   txt: "> jacking in..." },
    { at: 40,  txt: "> usb_hid spoof : OK" },
    { at: 85,  txt: "> hull sealed" },
    { at: 130, txt: "> opening the abyss" },
    { at: 195, txt: "!! DIVE !!" },
  ];

  function makeWorld() {
    wallSeed = Array.from({ length: 700 }, () => Math.random());
    bubbles = Array.from({ length: 45 }, () => ({ x: Math.random() * bw, y: Math.random() * bh, r: 1 + (Math.random() * 2 | 0), sp: 0.2 + Math.random() * 0.5, sw: Math.random() * 6.28 }));
    stars = Array.from({ length: 50 }, () => ({ x: Math.random() * bw, y: Math.random() * bh * 0.4, s: Math.random() < 0.5 ? 1 : 2 }));
  }

  function startGame() {
    state = "play"; paused = false;
    player = { x: bw / 2, y: bh - 22, w: 8 };
    bullets = []; enemies = []; particles = [];
    depth = 0; lives = 3; spawnTimer = 0; diff = 1; fireCd = 0; combo = 0; comboTimer = 0;
    pointerX = null; shakeMag = 0; sfxDive();
  }

  function spawnEnemy() {
    const size = 6 + Math.random() * 6;
    enemies.push({
      x: 14 + Math.random() * (bw - 28), y: -10, size,
      vy: (0.45 + Math.random() * 0.6) * diff, vx: (Math.random() - 0.5) * 0.7 * diff,
      hp: size > 10 ? 3 : (size > 8 ? 2 : 1),
      hue: ZONES[(Math.random() * 3) | 0], seed: Math.random() * 100
    });
  }

  function boom(x, y, color, n, spd) {
    for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = Math.random() * (spd || 2) + 0.5; particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1, color }); }
  }
  function shake(m) { shakeMag = Math.min(7, shakeMag + m); }

  // ---------- audio (WebAudio, no files) ----------
  function startAudio() {
    if (audioStarted) { if (actx && actx.state === "suspended") actx.resume(); return; }
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = muted ? 0 : 0.4; master.connect(actx.destination);
      droneFilter = actx.createBiquadFilter(); droneFilter.type = "lowpass"; droneFilter.frequency.value = 420;
      droneGain = actx.createGain(); droneGain.gain.value = 0;
      droneFilter.connect(droneGain); droneGain.connect(master);
      [55, 55.4, 82.5].forEach(f => { const o = actx.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.connect(droneFilter); o.start(); });
      audioStarted = true;
    } catch (e) { actx = null; }
  }
  function toggleMute() { muted = !muted; if (master && actx) master.gain.setTargetAtTime(muted ? 0 : 0.4, actx.currentTime, 0.05); }
  function tone(freq, dur, type, vol, slideTo) {
    if (!actx || muted) return;
    const o = actx.createOscillator(), g = actx.createGain(), now = actx.currentTime;
    o.type = type || "square"; o.frequency.setValueAtTime(freq, now);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), now + dur);
    g.gain.setValueAtTime(vol || 0.2, now); g.gain.exponentialRampToValueAtTime(0.0008, now + dur);
    o.connect(g); g.connect(master); o.start(now); o.stop(now + dur + 0.02);
  }
  function noise(dur, vol, cut) {
    if (!actx || muted) return;
    const len = (actx.sampleRate * dur) | 0, bufA = actx.createBuffer(1, len, actx.sampleRate), d = bufA.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const n = actx.createBufferSource(); n.buffer = bufA;
    const f = actx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cut || 1400;
    const g = actx.createGain(); g.gain.value = vol || 0.2;
    n.connect(f); f.connect(g); g.connect(master); n.start(); n.stop(actx.currentTime + dur);
  }
  function sfxShoot() { tone(900, 0.07, "square", 0.07, 320); }
  function sfxKill() { noise(0.18, 0.18, 1600); tone(320, 0.18, "square", 0.13, 70); }
  function sfxCombo(c) { tone(420 + c * 50, 0.06, "triangle", 0.1); }
  function sfxHit() { tone(150, 0.3, "sawtooth", 0.28, 45); noise(0.25, 0.18, 800); }
  function sfxDeath() { tone(300, 0.7, "sawtooth", 0.3, 40); }
  function sfxDive() { tone(200, 0.4, "square", 0.13, 760); }

  // ---------- buffer draw helpers ----------
  function bText(txt, x, y, size, color, align) {
    b.font = "bold " + size + 'px "Courier New", monospace';
    b.textAlign = align || "center"; b.textBaseline = "middle"; b.fillStyle = color;
    b.fillText(txt, x | 0, y | 0);
  }
  function glitchText(txt, x, y, size) { bText(txt, x - 1, y, size, MG, "center"); bText(txt, x + 1, y + 1, size, CY, "center"); bText(txt, x, y, size, WH, "center"); }

  function wallEdge(row, scroll, side) {
    const i = (row + scroll) | 0, v = wallSeed[((i % 700) + 700) % 700];
    const base = bw * 0.05, amp = bw * 0.045;
    const s = Math.sin((row + scroll) * 0.08) * 0.5 + 0.5;
    const e = base + (v * 0.6 + s * 0.4) * amp;
    return side === 0 ? e : bw - e;
  }

  function drawWalls() {
    const scroll = (depth * 0.4) | 0, zone = ZONES[((depth / 1600) | 0) % 3];
    for (let row = 0; row < bh; row++) {
      const le = wallEdge(row, scroll, 0) | 0, re = wallEdge(row, scroll, 1) | 0;
      b.fillStyle = "#0a0718"; b.fillRect(0, row, le, 1); b.fillRect(re, row, bw - re, 1);
      b.fillStyle = zone; b.globalAlpha = 0.6; b.fillRect(le - 1, row, 1, 1); b.fillRect(re, row, 1, 1); b.globalAlpha = 1;
    }
  }

  function drawBackground() {
    const zone = ZONES[((depth / 1600) | 0) % 3];
    const g = b.createLinearGradient(0, 0, 0, bh);
    g.addColorStop(0, "#111a3a"); g.addColorStop(0.45, "#0b1030"); g.addColorStop(1, "#05030f");
    b.fillStyle = g; b.fillRect(0, 0, bw, bh);
    // horizon neon glow band
    b.globalAlpha = 0.18; b.fillStyle = zone; b.fillRect(0, bh * 0.14, bw, 3); b.globalAlpha = 1;
    for (const s of stars) { b.globalAlpha = 0.25 + Math.sin((t + s.x) * 0.06) * 0.2; b.fillStyle = CY; b.fillRect(s.x | 0, s.y | 0, s.s, s.s); }
    b.globalAlpha = 1;
    drawWalls();
    // rising bubbles
    for (const d of bubbles) { b.globalAlpha = 0.35; b.fillStyle = zone; b.fillRect((d.x + Math.sin(t * 0.05 + d.sw) * 2) | 0, d.y | 0, d.r, d.r); }
    b.globalAlpha = 1;
  }

  function drawEnemy(e) {
    const x = e.x | 0, y = (e.y + Math.sin((t + e.seed) * 0.12) * 1.3) | 0, s = e.size | 0;
    b.fillStyle = "#0a0a1c"; b.fillRect(x - s, y - ((s * 0.7) | 0), s * 2, (s * 1.4) | 0);
    b.fillStyle = e.hue;
    b.fillRect(x - s, y - ((s * 0.7) | 0), s * 2, 1);
    b.fillRect(x - s, y + ((s * 0.7) | 0) - 1, s * 2, 1);
    b.fillRect(x - s, y - ((s * 0.7) | 0), 1, (s * 1.4) | 0);
    b.fillRect(x + s - 1, y - ((s * 0.7) | 0), 1, (s * 1.4) | 0);
    b.fillRect(x - s - 2, y - 1, 2, 2); b.fillRect(x + s, y - 1, 2, 2); // fins
    b.fillStyle = (t % 18 < 9) ? WH : e.hue;
    b.fillRect(x - ((s * 0.45) | 0), y - 1, 2, 2); b.fillRect(x + ((s * 0.45) | 0) - 2, y - 1, 2, 2); // eyes
  }

  function drawPlayer() {
    const x = player.x | 0, y = player.y | 0;
    b.fillStyle = CY;
    b.fillRect(x - 1, y - 8, 2, 4);
    b.fillRect(x - 3, y - 4, 6, 3);
    b.fillRect(x - 6, y - 1, 12, 3);
    b.fillRect(x - 8, y + 2, 16, 3);
    b.fillStyle = WH; b.fillRect(x - 1, y - 3, 2, 2);
    b.fillStyle = (t % 6 < 3) ? YE : MG; b.fillRect(x - 2, y + 5, 4, 3 + (Math.random() * 3 | 0));
  }

  function glitch(amt) {
    const n = (amt * 6) | 0;
    for (let i = 0; i < n; i++) {
      const y = (Math.random() * bh) | 0, h = 1 + (Math.random() * 4 | 0), dx = ((Math.random() - 0.5) * 22 * amt) | 0;
      try { b.putImageData(b.getImageData(0, y, bw, h), dx, y); } catch (err) {}
    }
  }

  // ---------- update ----------
  function update() {
    t++;
    shakeMag *= 0.85; shX = (Math.random() - 0.5) * shakeMag * PIX; shY = (Math.random() - 0.5) * shakeMag * PIX;
    for (const d of bubbles) { d.y -= d.sp; if (d.y < 0) { d.y = bh; d.x = Math.random() * bw; } }
    if (hitFlash > 0) hitFlash--;
    if (actx) {
      const dep = depth || 0;
      droneGain.gain.setTargetAtTime((state === "play" && !paused) ? 0.45 : 0.0, actx.currentTime, 0.25);
      droneFilter.frequency.setTargetAtTime(Math.max(130, 460 - dep * 0.03), actx.currentTime, 0.3);
    }

    if (state !== "play" || paused) {
      if (particles) { for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life -= 0.03; } particles = particles.filter(p => p.life > 0); }
      return;
    }

    depth += 0.7 * diff; diff = 1 + depth / 2600;
    const sp = 3.0;
    if (keys["arrowleft"] || keys["a"]) player.x -= sp;
    if (keys["arrowright"] || keys["d"]) player.x += sp;
    if (pointerX !== null) player.x += (pointerX / PIX - player.x) * 0.25;
    player.x = Math.max(player.w, Math.min(bw - player.w, player.x));

    fireCd--;
    if ((shootHeld || firePulse) && fireCd <= 0) { bullets.push({ x: player.x, y: player.y - 8 }); fireCd = 8; sfxShoot(); }
    firePulse = false;
    for (const bl of bullets) bl.y -= 3.6;
    bullets = bullets.filter(bl => bl.y > -6);

    spawnTimer--; if (spawnTimer <= 0) { spawnEnemy(); spawnTimer = Math.max(10, 44 - diff * 5); }
    for (const e of enemies) { e.y += e.vy; e.x += e.vx; if (e.x < e.size + 1 || e.x > bw - e.size - 1) e.vx *= -1; }

    for (const bl of bullets) for (const e of enemies) {
      if (e.dead) continue;
      if (Math.abs(bl.x - e.x) < e.size && Math.abs(bl.y - e.y) < e.size) {
        e.hp--; bl.y = -99; boom(bl.x, e.y, e.hue, 4, 1.5);
        if (e.hp <= 0) { e.dead = true; combo++; comboTimer = 80; depth += 25 * Math.max(1, combo); boom(e.x, e.y, e.hue, 14, 3); shake(2); sfxKill(); if (combo > 1) sfxCombo(combo); }
      }
    }
    bullets = bullets.filter(bl => bl.y > -6);

    for (const e of enemies) {
      if (e.dead) continue;
      if (Math.abs(e.x - player.x) < e.size + player.w * 0.6 && Math.abs(e.y - player.y) < e.size + 4) { e.dead = true; loseLife(e.x, e.y); }
      else if (e.y > bh + 8) { e.dead = true; combo = 0; }
    }
    enemies = enemies.filter(e => !e.dead);

    if (comboTimer > 0 && --comboTimer === 0) combo = 0;
    for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.life -= 0.03; }
    particles = particles.filter(p => p.life > 0);
  }

  function loseLife(x, y) {
    lives--; combo = 0; hitFlash = 13; shake(6); boom(x, y, MG, 20, 3.5); sfxHit();
    flick.style.opacity = "0.55"; setTimeout(() => flick.style.opacity = "0", 90);
    if (lives <= 0) { state = "dead"; sfxDeath(); const d = depth | 0; if (d > best) { best = d; localStorage.setItem("neodive_best", best); } }
  }

  // ---------- render to buffer, then blit scaled ----------
  function drawHUD() {
    bText("DEPTH " + (depth | 0) + "m", 5, 7, 9, CY, "left");
    bText("BEST " + best + "m", bw - 5, 7, 8, YE, "right");
    for (let i = 0; i < lives; i++) { b.fillStyle = MG; b.fillRect(5 + i * 7, 13, 5, 4); }
    if (combo > 1) bText("x" + combo, bw / 2, 9, 10, PU, "center");
  }

  function renderBoot() {
    b.fillStyle = "#05030f"; b.fillRect(0, 0, bw, bh);
    b.font = '8px "Courier New", monospace'; b.textAlign = "left"; b.textBaseline = "alphabetic";
    for (let i = 0; i < 40; i++) {
      const x = (i * 15) % bw, y = ((t * 1.1 + i * 47) % (bh + 60)) - 30;
      b.fillStyle = "rgba(25,230,255," + (0.08 + (i % 5) * 0.03) + ")";
      b.fillText(String.fromCharCode(0x30A0 + ((t + i * 7) % 90)), x, y);
    }
    glitchText("NEO//DIVE", bw / 2, bh * 0.2, 22);
    let y = bh * 0.38;
    for (const line of bootLines) {
      if (t >= line.at) {
        const big = line.txt.indexOf("!!") === 0;
        bText(line.txt, bw * 0.16 + (big ? (Math.random() - 0.5) * 3 : 0), y, big ? 16 : 9, big ? MG : CY, "left");
        y += big ? 22 : 13;
      }
    }
    if (t > 195) glitch(Math.min(1, (t - 195) / 45));
    if (t > 140 && Math.random() < 0.14) { flick.style.opacity = "0.6"; setTimeout(() => flick.style.opacity = "0", 60); }
    if (t > 250 && t % 44 < 28) bText("[ PRESS ANY KEY / CLICK ]", bw / 2, bh * 0.8, 10, YE, "center");
  }

  function renderGame() {
    drawBackground();
    for (const p of particles) { b.globalAlpha = Math.max(0, p.life); b.fillStyle = p.color; b.fillRect(p.x | 0, p.y | 0, 2, 2); }
    b.globalAlpha = 1;
    for (const bl of bullets) { b.fillStyle = WH; b.fillRect((bl.x | 0), (bl.y | 0) - 3, 1, 4); b.fillStyle = CY; b.fillRect((bl.x | 0), (bl.y | 0) + 1, 1, 2); }
    for (const e of enemies) drawEnemy(e);
    if (state === "play") drawPlayer();
    drawHUD();

    if (hitFlash > 0) { b.fillStyle = "rgba(255,46,136," + (hitFlash / 38) + ")"; b.fillRect(0, 0, bw, bh); if (hitFlash > 6) glitch(0.5); }
    if (paused) { b.fillStyle = "rgba(5,3,15,0.6)"; b.fillRect(0, 0, bw, bh); glitchText("PAUSED", bw / 2, bh / 2, 20); bText("press P to resume", bw / 2, bh / 2 + 16, 9, PU, "center"); }
    if (state === "dead") {
      b.fillStyle = "rgba(5,3,15,0.72)"; b.fillRect(0, 0, bw, bh);
      if (Math.random() < 0.45) glitch(0.55);
      glitchText("HULL LOST", bw / 2, bh / 2 - 22, 24);
      bText("DEPTH " + (depth | 0) + "m", bw / 2, bh / 2 + 4, 12, CY, "center");
      bText("BEST " + best + "m", bw / 2, bh / 2 + 20, 9, YE, "center");
      if (t % 42 < 27) bText("[ PRESS ANY KEY / CLICK TO REDIVE ]", bw / 2, bh / 2 + 42, 9, WH, "center");
    }
  }

  function blit() {
    vctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    vctx.fillStyle = "#05030f"; vctx.fillRect(0, 0, W, H);
    vctx.imageSmoothingEnabled = false;
    vctx.drawImage(buf, 0, 0, bw, bh, shX, shY, W, H);
    // neon bloom pass
    vctx.globalCompositeOperation = "lighter"; vctx.globalAlpha = 0.33; vctx.imageSmoothingEnabled = true;
    vctx.drawImage(buf, 0, 0, bw, bh, shX - 4, shY - 4, W + 8, H + 8);
    vctx.globalAlpha = 1; vctx.globalCompositeOperation = "source-over";
  }

  function loop() {
    update();
    if (state === "boot") renderBoot(); else renderGame();
    blit();
    requestAnimationFrame(loop);
  }
  resize();
  loop();
})();
</script>
</body>
</html>
