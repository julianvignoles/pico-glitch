<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>PICO//BREACH</title>
<style>
  :root { --neon:#00ffd5; --pink:#ff2d95; --yellow:#ffe600; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; background:#000; overflow:hidden; }
  body {
    font-family: "Courier New", monospace;
    display:flex; align-items:center; justify-content:center;
    cursor:crosshair;
    touch-action:none;
  }
  #game { display:block; background:#05020a; image-rendering:pixelated; }
  /* CRT scanlines + vignette overlay */
  #crt {
    position:fixed; inset:0; pointer-events:none; z-index:10;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.18) 3px, rgba(0,0,0,0.18) 4px),
      radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,0.6) 100%);
    mix-blend-mode:multiply;
  }
  #flicker { position:fixed; inset:0; pointer-events:none; z-index:11; background:#00ffd5; opacity:0; mix-blend-mode:screen; }
  #hint { position:fixed; bottom:8px; left:0; right:0; text-align:center; color:#2b6; font-size:12px; z-index:12; opacity:.6; letter-spacing:2px; }
</style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="crt"></div>
  <div id="flicker"></div>
  <div id="hint">MOVE: ← → / A D &nbsp;•&nbsp; SHOOT: SPACE / CLICK &nbsp;•&nbsp; PAUSE: P</div>
<script>
(() => {
  const cv = document.getElementById('game');
  const ctx = cv.getContext('2d');
  const flick = document.getElementById('flicker');
  let W, H, DPR;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    cv.style.width = W + 'px'; cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- input ----------
  const keys = {};
  let shootHeld = false, firePulse = false;
  addEventListener('keydown', e => {
    keys[e.key.toLowerCase()] = true;
    if ([' ','arrowleft','arrowright','arrowup','arrowdown'].includes(e.key.toLowerCase())) e.preventDefault();
    if (e.key === ' ') { shootHeld = true; }
    if (state === 'boot') advance();
    if (state === 'dead') startGame();
    if (e.key.toLowerCase() === 'p' && state === 'play') paused = !paused;
  });
  addEventListener('keyup', e => {
    keys[e.key.toLowerCase()] = false;
    if (e.key === ' ') shootHeld = false;
  });
  let pointerX = null;
  addEventListener('pointerdown', e => {
    pointerX = e.clientX; shootHeld = true; firePulse = true;
    if (state === 'boot') advance();
    else if (state === 'dead') startGame();
  });
  addEventListener('pointermove', e => { if (pointerX !== null) pointerX = e.clientX; });
  addEventListener('pointerup', () => { shootHeld = false; });

  // ---------- state ----------
  let state = 'boot';        // boot -> play -> dead
  let paused = false;
  let t = 0;                 // global frame counter
  let bootStart = 0;

  // boot message script
  const bootLines = [
    { at:0,   txt:'> usb_hid device attached' },
    { at:45,  txt:'> emulating HID keyboard...' },
    { at:95,  txt:'> keystroke injection OK' },
    { at:150, txt:'> payload delivered' },
    { at:210, txt:'!! YOU HAVE BEEN PICO'D !!' },
  ];

  // ---------- game objects ----------
  let player, bullets, enemies, particles, stars;
  let score, best = +(localStorage.getItem('pico_best') || 0), lives, spawnTimer, diff, fireCd;

  function startGame() {
    state = 'play'; paused = false;
    player = { x: W/2, y: H - 70, w: 34, h: 30, cd:0 };
    bullets = []; enemies = []; particles = [];
    score = 0; lives = 3; spawnTimer = 0; diff = 1; fireCd = 0;
    pointerX = null;
  }

  function advance() { startGame(); }

  // starfield / grid
  stars = Array.from({length: 90}, () => ({ x:Math.random(), y:Math.random(), s:Math.random()*2+0.4, v:Math.random()*0.4+0.1 }));

  function spawnEnemy() {
    const size = 26 + Math.random()*16;
    const kinds = ['box','diamond','tri'];
    enemies.push({
      x: 30 + Math.random()*(W-60), y: -40, size,
      vy: (1.1 + Math.random()*1.2) * diff,
      vx: (Math.random()-0.5) * 1.2 * diff,
      hp: size > 36 ? 2 : 1,
      kind: kinds[(Math.random()*kinds.length)|0],
      rot: Math.random()*Math.PI, spin: (Math.random()-0.5)*0.08,
      hue: Math.random() < 0.5 ? '#ff2d95' : '#ffe600'
    });
  }

  function boom(x, y, color, n=16) {
    for (let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, sp = Math.random()*4+1;
      particles.push({ x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, life:1, color });
    }
  }

  // ---------- drawing helpers ----------
  function neonText(txt, x, y, size, color, align='center') {
    ctx.save();
    ctx.font = `bold ${size}px "Courier New", monospace`;
    ctx.textAlign = align; ctx.textBaseline = 'middle';
    ctx.shadowColor = color; ctx.shadowBlur = 18;
    ctx.fillStyle = color; ctx.fillText(txt, x, y);
    ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; ctx.globalAlpha = 0.35;
    ctx.fillText(txt, x, y);
    ctx.restore();
  }

  function drawBackground() {
    ctx.fillStyle = '#05020a'; ctx.fillRect(0,0,W,H);
    // synthwave sun
    const cx = W/2, sunY = H*0.34, r = Math.min(W,H)*0.22;
    const g = ctx.createLinearGradient(0, sunY-r, 0, sunY+r);
    g.addColorStop(0, '#ffe600'); g.addColorStop(0.5,'#ff2d95'); g.addColorStop(1,'#7a0b55');
    ctx.save(); ctx.globalAlpha = 0.5;
    ctx.beginPath(); ctx.arc(cx, sunY, r, 0, Math.PI*2); ctx.fillStyle = g; ctx.fill();
    // sun stripes
    ctx.globalCompositeOperation = 'destination-out';
    for (let i=0;i<7;i++){ const yy = sunY - r*0.2 + i*6 + (i*i); ctx.fillStyle='#000'; ctx.fillRect(cx-r, yy, r*2, 3+i*0.6); }
    ctx.restore();
    // stars
    ctx.fillStyle = 'rgba(0,255,213,0.7)';
    for (const s of stars){ s.y += s.v*0.004; if (s.y>1) s.y=0; ctx.globalAlpha=0.3+s.s*0.2; ctx.fillRect(s.x*W, s.y*H, s.s, s.s); }
    ctx.globalAlpha = 1;
    // perspective grid floor
    const horizon = H*0.55;
    ctx.strokeStyle = 'rgba(0,255,213,0.35)'; ctx.lineWidth = 1;
    for (let i=1;i<=14;i++){ const p=i/14; const yy=horizon+(H-horizon)*p*p; ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W,yy); ctx.stroke(); }
    const off = (t*2) % 60;
    for (let i=-10;i<=10;i++){ ctx.beginPath(); ctx.moveTo(cx+i*40, horizon); ctx.lineTo(cx+i*180+off*0, H); ctx.stroke(); }
  }

  function drawEnemy(e) {
    ctx.save(); ctx.translate(e.x, e.y); ctx.rotate(e.rot);
    ctx.shadowColor = e.hue; ctx.shadowBlur = 14;
    ctx.strokeStyle = e.hue; ctx.lineWidth = 2.5; ctx.fillStyle = 'rgba(0,0,0,0.5)';
    const s = e.size/2;
    ctx.beginPath();
    if (e.kind==='box'){ ctx.rect(-s,-s,e.size,e.size); }
    else if (e.kind==='diamond'){ ctx.moveTo(0,-s); ctx.lineTo(s,0); ctx.lineTo(0,s); ctx.lineTo(-s,0); ctx.closePath(); }
    else { ctx.moveTo(0,-s); ctx.lineTo(s,s); ctx.lineTo(-s,s); ctx.closePath(); }
    ctx.fill(); ctx.stroke(); ctx.restore();
  }

  function drawPlayer() {
    ctx.save(); ctx.translate(player.x, player.y);
    ctx.shadowColor = '#00ffd5'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#00ffd5'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(0,-player.h/2); ctx.lineTo(player.w/2,player.h/2); ctx.lineTo(0,player.h*0.3); ctx.lineTo(-player.w/2,player.h/2); ctx.closePath();
    ctx.fill(); ctx.stroke();
    // thruster
    ctx.fillStyle = (t%6<3)?'#ffe600':'#ff2d95';
    ctx.fillRect(-3, player.h/2, 6, 6+Math.random()*6);
    ctx.restore();
  }

  // glitch slice effect: redraw random horizontal bands offset + RGB split
  function glitchPass(intensity) {
    const bands = (intensity*6)|0;
    for (let i=0;i<bands;i++){
      const by = Math.random()*H, bh = 6+Math.random()*26, dx = (Math.random()-0.5)*40*intensity;
      try { const img = ctx.getImageData(0, by*DPR, cv.width, bh*DPR); ctx.putImageData(img, dx*DPR, by*DPR); } catch(e){}
    }
    if (Math.random() < 0.5*intensity) {
      ctx.save(); ctx.globalCompositeOperation='screen'; ctx.globalAlpha=0.25;
      ctx.drawImage(cv, (Math.random()-0.5)*8, 0, W, H);
      ctx.fillStyle='#ff0040'; ctx.fillRect((Math.random()-0.5)*6,0,W,H); ctx.restore();
    }
  }

  // ---------- update ----------
  function update() {
    t++;
    if (state === 'play' && !paused) {
      diff = 1 + score/900;
      // move player
      const speed = 6.5;
      if (keys['arrowleft'] || keys['a']) player.x -= speed;
      if (keys['arrowright'] || keys['d']) player.x += speed;
      if (pointerX !== null) player.x += (pointerX - player.x) * 0.25;
      player.x = Math.max(player.w/2, Math.min(W-player.w/2, player.x));
      // fire
      fireCd--;
      if ((shootHeld || firePulse) && fireCd <= 0) {
        bullets.push({ x:player.x, y:player.y-player.h/2, vy:-11 });
        fireCd = 9;
      }
      firePulse = false;
      // bullets
      for (const b of bullets) b.y += b.vy;
      bullets = bullets.filter(b => b.y > -20);
      // spawn
      spawnTimer--; if (spawnTimer<=0){ spawnEnemy(); spawnTimer = Math.max(16, 55 - diff*6); }
      // enemies
      for (const e of enemies){ e.y += e.vy; e.x += e.vx; e.rot += e.spin;
        if (e.x < e.size/2 || e.x > W-e.size/2) e.vx *= -1; }
      // collisions bullet/enemy
      for (const b of bullets){
        for (const e of enemies){
          if (e.dead) continue;
          if (Math.abs(b.x-e.x) < e.size/2 && Math.abs(b.y-e.y) < e.size/2){
            e.hp--; b.y = -999;
            if (e.hp<=0){ e.dead = true; score += 10; boom(e.x,e.y,e.hue); }
            else boom(e.x,e.y,e.hue,5);
          }
        }
      }
      bullets = bullets.filter(b => b.y > -20);
      // enemy hits player or floor
      for (const e of enemies){
        if (e.dead) continue;
        if (Math.abs(e.x-player.x) < (e.size/2+player.w/2)*0.7 && Math.abs(e.y-player.y) < (e.size/2+player.h/2)*0.7){
          e.dead = true; loseLife(e.x,e.y);
        } else if (e.y > H+30){ e.dead = true; loseLife(player.x, H-40, true); }
      }
      enemies = enemies.filter(e => !e.dead);
      // particles
      for (const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.life-=0.03; }
      particles = particles.filter(p => p.life>0);
    } else {
      // keep particles alive in dead screen
      for (const p of (particles||[])){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.08; p.life-=0.03; }
      if (particles) particles = particles.filter(p => p.life>0);
    }
  }

  let hitFlash = 0;
  function loseLife(x,y,missed) {
    lives--; hitFlash = 12; boom(x,y,'#ff0040',24);
    flick.style.opacity = '0.5'; setTimeout(()=>flick.style.opacity='0', 80);
    if (lives <= 0) {
      state = 'dead';
      if (score > best){ best = score; localStorage.setItem('pico_best', best); }
    }
  }

  // ---------- render ----------
  function render() {
    if (state === 'boot') { renderBoot(); return; }

    drawBackground();
    // particles
    for (const p of particles){ ctx.globalAlpha = Math.max(0,p.life); ctx.fillStyle=p.color; ctx.shadowColor=p.color; ctx.shadowBlur=8; ctx.fillRect(p.x-2,p.y-2,4,4); }
    ctx.globalAlpha=1; ctx.shadowBlur=0;
    // bullets
    for (const b of bullets){ ctx.fillStyle='#fff'; ctx.shadowColor='#00ffd5'; ctx.shadowBlur=10; ctx.fillRect(b.x-2,b.y-10,4,12); }
    ctx.shadowBlur=0;
    for (const e of enemies) drawEnemy(e);
    if (state==='play') drawPlayer();

    // HUD
    neonText('SCORE '+score, 16, 26, 20, '#00ffd5', 'left');
    neonText('BEST '+best, W-16, 26, 16, '#ffe600', 'right');
    let hs=''; for(let i=0;i<lives;i++) hs+='▲ ';
    neonText(hs.trim(), 16, 52, 18, '#ff2d95', 'left');

    if (hitFlash>0){ hitFlash--; ctx.fillStyle='rgba(255,0,64,'+(hitFlash/30)+')'; ctx.fillRect(0,0,W,H); glitchPass(0.6); }

    if (paused) { ctx.fillStyle='rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,H); neonText('|| PAUSED', W/2, H/2, 40, '#00ffd5'); }

    if (state === 'dead') {
      ctx.fillStyle='rgba(5,2,10,0.72)'; ctx.fillRect(0,0,W,H);
      if (Math.random()<0.4) glitchPass(0.5);
      neonText('GAME OVER', W/2, H/2-50, 54, '#ff2d95');
      neonText('SCORE '+score, W/2, H/2+6, 26, '#00ffd5');
      neonText('BEST '+best, W/2, H/2+40, 18, '#ffe600');
      if (t%40<26) neonText('[ PRESS ANY KEY / CLICK TO RETRY ]', W/2, H/2+92, 16, '#fff');
    }
  }

  function renderBoot() {
    const el = t - bootStart;
    ctx.fillStyle = '#05020a'; ctx.fillRect(0,0,W,H);
    // faint falling code rain
    ctx.font = '14px "Courier New", monospace';
    for (let i=0;i<40;i++){
      const x=(i*53)%W, y=((t*3 + i*160)%(H+200))-100;
      ctx.fillStyle='rgba(0,255,100,'+(0.05+(i%5)*0.03)+')';
      ctx.fillText(String.fromCharCode(33+((t+i*7)%90)), x, y);
    }
    // messages
    let y = H*0.32;
    ctx.textAlign='left'; ctx.font='bold 18px "Courier New", monospace';
    for (const line of bootLines){
      if (el >= line.at){
        const big = line.txt.startsWith('!!');
        const col = big ? '#ff2d95' : '#00ffd5';
        ctx.save();
        ctx.shadowColor=col; ctx.shadowBlur = big?22:6; ctx.fillStyle=col;
        ctx.font = big ? 'bold 34px "Courier New", monospace' : 'bold 18px "Courier New", monospace';
        const jitter = big ? (Math.random()-0.5)*6 : 0;
        ctx.fillText(line.txt, W*0.14 + jitter, y);
        ctx.restore();
        y += big ? 60 : 34;
      }
    }
    // heavy glitch after the big line
    if (el > 210) glitchPass(Math.min(1, (el-210)/40));
    if (el > 150 && Math.random()<0.15){ flick.style.opacity='0.6'; setTimeout(()=>flick.style.opacity='0',60); }
    // prompt
    if (el > 260 && (t%44<28)) neonText('[ PRESS ANY KEY / CLICK TO BREACH ]', W/2, H*0.82, 20, '#ffe600');
  }

  // ---------- loop ----------
  bootStart = 0;
  function loop(){ update(); render(); requestAnimationFrame(loop); }
  loop();
})();
</script>
</body>
</html>
